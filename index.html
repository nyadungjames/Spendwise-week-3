<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="card page-header">
            <h1>Budget Tracker</h1>
            <p>Track your spending and stay on budget with ease</p>
        </header>

        <section class="card form-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries, Rent" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="expense-amount">Amount (KES)</label>
                        <input type="number" id="expense-amount" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="expense-category">Category</label>
                        <select id="expense-category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Housing">Housing</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Expense</button>
            </form>
        </section>

        <section class="card table-section">
            <div class="table-header">
                <h2>Your Expenses</h2>
                <span class="total-badge">Total: KES 2,450.00</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th><th>Amount</th><th>Category</th><th>Date</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Groceries</td><td>KES 1,200</td><td><span class="category food">Food</span></td><td>2026-10-20</td><td><button class="btn btn-small btn-danger">Delete</button></td></tr>
                        <tr><td>Matatu Fare</td><td>KES 150</td><td><span class="category transport">Transport</span></td><td>2026-10-21</td><td><button class="btn btn-small btn-danger">Delete</button></td></tr>
                        <tr><td>WiFi Bill</td><td>KES 800</td><td><span class="category utilities">Utilities</span></td><td>2026-10-22</td><td><button class="btn btn-small btn-danger">Delete</button></td></tr>
                        <tr><td>Movie Night</td><td>KES 300</td><td><span class="category entertainment">Entertainment</span></td><td>2026-10-23</td><td><button class="btn btn-small btn-danger">Delete</button></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
